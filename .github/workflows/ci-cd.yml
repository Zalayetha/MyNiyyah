name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myniyyah
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myniyyah"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/myniyyah?schema=public"
      BETTER_AUTH_SECRET: "ci-dummy-auth-secret-for-build-and-testing-only-12345"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_TRUSTED_ORIGINS: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm contract:emit

      - name: Apply database schema
        run: pnpm db:update

      - name: Seed reference data
        run: pnpm db:seed

      - name: Verify database schema
        run: pnpm db:verify

      - name: Check formatting and linting
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  cd:
    name: Deployment gate
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report deployment gate status
        run: echo "CI passed for $GITHUB_SHA. Enable the documented SSH block only after VPS secrets and restore rehearsal are verified."
      - name: SSH to server and run script
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /root/live/MyNiyyah
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            corepack enable
            pnpm install --frozen-lockfile
            set -a
            . /root/live/MyNiyyah/.env
            set +a
            pnpm contract:emit
            pnpm db:update
            pnpm db:seed
            pnpm db:verify
            pnpm build
            pm2 reload ecosystem.config.cjs --only MyNiyyah --update-env
            curl --fail --silent --show-error --max-time 10 https://myniyyah.my.id/api/ready
