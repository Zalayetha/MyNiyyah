name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/myniyyah?schema=public"
      BETTER_AUTH_SECRET: "ci-dummy-auth-secret-for-build-and-testing-only-12345"
      BETTER_AUTH_URL: "http://localhost:3000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma contract emit

      - name: Check formatting and linting
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  cd:
    name: Deployment placeholder
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Log deployment placeholder
        run: echo "CD placeholder — deployment would run for commit $GITHUB_SHA"
